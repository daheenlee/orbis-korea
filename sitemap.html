<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사이트맵 | ORBIS 대한민국지부</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>
  <div id="site-header"></div>
  <header class="page-hero">
    <div class="wrap">
      <div class="crumb"><a href="index.html">홈</a> · 사이트맵</div>
      <h1>사이트맵</h1>
      <p>공식 포털의 전체 메뉴입니다.</p>
    </div>
  </header>
  <main id="content" class="section">
    <div class="wrap panel">
      <div id="search-results" class="search-results card" style="margin-bottom:18px">
        <div class="card-h">검색 결과</div>
        <ul class="list" id="result-list"></ul>
      </div>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="world/index.html">세계관</a></li>
        <li><a href="history/index.html">연혁</a></li>
        <li><a href="org/index.html">조직도</a></li>
        <li><a href="rules/index.html">규칙(복무규정)</a></li>
        <li><a href="people/index.html">구성원 소개</a></li>
        <li><a href="uniform/index.html">복장(제복 기준)</a></li>
      </ul>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const items = [
        ["홈", "index.html", "포털 첫화면 공지 현황"],
        ["세계관", "world/index.html", "궤도 경계 관할 기록"],
        ["연혁", "history/index.html", "설치 이후 공식 연보"],
        ["조직도", "org/index.html", "지부장 실 국 과 편제"],
        ["규칙", "rules/index.html", "복무 보안 현장 제복 조문"],
        ["구성원", "people/index.html", "한서윤 권민재 이도하 박하린 최은설"],
        ["복장", "uniform/index.html", "정복 근무복 현장복 휘장"]
      ];
      const q = new URLSearchParams(location.search).get("q");
      if (!q) return;
      const box = document.getElementById("search-results");
      const list = document.getElementById("result-list");
      const hit = items.filter(function (it) {
        return (it[0] + it[2]).indexOf(q) !== -1;
      });
      box.classList.add("on");
      if (!hit.length) {
        list.innerHTML = "<li>검색 결과가 없습니다.</li>";
        return;
      }
      list.innerHTML = hit.map(function (it) {
        return "<li><a href='" + it[1] + "'>" + it[0] + "</a><span>" + it[2] + "</span></li>";
      }).join("");
    })();
  </script>
</body>
</html>
