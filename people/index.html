<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>구성원 프로필 · 오르비스 지부</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../img/logo.png" type="image/png"><link rel="stylesheet" href="../css/people.css"></head>
<body><div id="site-header"></div><main id="content"><section class="pf" id="pf" data-profile-mode="night"><div class="wrap">
<div class="pf-directory"><div class="pf-directory-heading"><div><small>ORBIS · PERSONNEL ARCHIVE</small><h1>직원 인사기록</h1><p>열람할 직원을 선택하면 상세 기록이 열립니다.</p></div><span class="pf-directory-count" id="directory-count"></span></div><div class="pf-directory-controls"><label>직원 검색<input id="people-search" type="search" placeholder="이름 검색" autocomplete="off"></label><label>소속 부서<select id="people-dept"><option value="">전체 부서</option></select></label><label>기록 구분<select id="people-mode-filter"><option value="all">전체</option><option value="day">주간 기록</option><option value="night">야간 기록</option></select></label></div><div class="pf-directory-grid" id="people-directory"></div><p class="pf-directory-empty" id="people-empty" hidden>조건에 맞는 직원이 없습니다.</p></div>
